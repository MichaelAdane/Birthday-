<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heldu 🎂</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#111;
  color:#fff;
  text-align:center;
}

.page{
  display:none;
  padding:40px;
}

.active{
  display:block;
}

button{
  padding:10px 20px;
  margin-top:20px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

input{
  padding:10px;
  border-radius:6px;
  border:none;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="p1" class="page active">
  <h2>Enter Password 🔐</h2>
  <input id="pass" placeholder="Hint: her nickname">
  <br>
  <button onclick="check()">Unlock</button>
</div>

<!-- PAGE 2 -->
<div id="p2" class="page">
  <h1>Happy Birthday Heldu 🎉</h1>
  <p id="typing"></p>
  <button onclick="nextPage(3)">Next</button>
</div>

<!-- PAGE 3 -->
<div id="p3" class="page">
  <h2>Memories 📸</h2>
  <img id="slide" src="https://via.placeholder.com/250">
  <p>You are special 💖</p>
  <button onclick="nextPage(4)">Next</button>
</div>

<!-- PAGE 4 -->
<div id="p4" class="page">
  <h2>Secret 👀</h2>
  <button onclick="reveal()">Reveal</button>
  <p id="secret" style="display:none">You mean a lot to me ❤️</p>
  <button onclick="nextPage(5)">Final</button>
</div>

<!-- PAGE 5 -->
<div id="p5" class="page">
  <h1>Final Message 💌</h1>
  <p>
    Heldu,<br><br>
    I appreciate you more than words can say.<br>
    Happy Birthday ❤️
  </p>
</div>

<script>
// PASSWORD CHECK (FIXED)
function check(){
  const value = document.getElementById("pass").value.trim().toLowerCase();

  if(value === "hel"){
    nextPage(2);
  } else {
    alert("Wrong password");
  }
}

// PAGE SWITCH
function nextPage(p){
  document.querySelectorAll(".page").forEach(el=>el.classList.remove("active"));
  document.getElementById("p"+p).classList.add("active");
}

// TYPING EFFECT
const text = "You are truly special 💫";
let i = 0;
function type(){
  if(i < text.length){
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(type, 50);
  }
}

// start typing when page loads
type();

// IMAGE SLIDER (works even without local files)
const images = [
  "https://via.placeholder.com/250",
  "https://via.placeholder.com/250/ff4b5c",
  "https://via.placeholder.com/250/333"
];

let index = 0;
setInterval(()=>{
  index = (index + 1) % images.length;
  document.getElementById("slide").src = images[index];
},2000);

// SECRET
function reveal(){
  document.getElementById("secret").style.display = "block";
}
</script>

</body>
</html>
